<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .badge {
      background: #2563eb;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }
    h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    p {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      margin: 0 0 14px 0;
    }
    .btn {
      width: 100%;
      box-sizing: border-box;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.95;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      padding: 8px;
      border-radius: 8px;
      display: none;
    }
    .status.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">IT</span>
    <h2>Intern Track Importer</h2>
  </div>
  <p id="info-text">Rileva l'annuncio aperto su LinkedIn e importalo automaticamente nella tua dashboard con logo e campi estratti da Gemini.</p>
  <button id="import-btn" class="btn">
    <span>✦ Invia annuncio a Intern Track</span>
  </button>
  <div id="status-box" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
